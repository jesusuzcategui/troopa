version: '3'

info:
  companyName: "Troopa"
  productName: "Troopa"
  productIdentifier: "dev.troopa.desktop"
  description: "Your AI agent troop"
  copyright: "MIT License"
  comments: "Troopa Desktop"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - desktop/frontend
      - github_page
      - bin
    file:
      - .DS_Store
      - .gitignore
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
