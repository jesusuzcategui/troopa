version: 2

project_name: troopa

builds:
  - id: troopa
    main: ./cmd/troopa
    binary: troopa
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - README.es.md

checksum:
  name_template: checksums.txt

# Linux packages attached to every release: .deb, .rpm, .apk and Arch.
nfpms:
  - id: packages
    package_name: troopa
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: https://jesusuzcategui.github.io/troopa/
    description: Your AI agent troop in the terminal.
    maintainer: Jesús Uzcátegui <jesusuzcategui@users.noreply.github.com>
    license: MIT
    formats: [deb, rpm, apk, archlinux]
    recommends:
      - git
    bindir: /usr/bin

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: jesusuzcategui
    name: troopa
  draft: false
  prerelease: auto

