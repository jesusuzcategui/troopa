version: 2

project_name: troopa

builds:
  - id: troopa
    main: ./cmd/troopa
    binary: troopa
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

release:
  disable: true

changelog:
  disable: true
